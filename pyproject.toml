[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boilingbench-cv"
version = "0.1.0"
description = "Reproducible benchmark utilities for bubble instance segmentation."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "UARK-NED3"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
